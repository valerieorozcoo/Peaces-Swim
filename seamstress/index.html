<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Peaces Seamstress Queue</title>
<link rel="icon" type="image/png" href="/art/logo-ps.png">
<style>
@font-face{font-family:"Open Sauce Sans";font-style:normal;font-weight:300;font-display:swap;src:url("../fonts/open-sauce-sans-latin-300-normal.woff2") format("woff2");}
@font-face{font-family:"Open Sauce Sans";font-style:italic;font-weight:300;font-display:swap;src:url("../fonts/open-sauce-sans-latin-300-italic.woff2") format("woff2");}
@font-face{font-family:"Open Sauce Sans";font-style:normal;font-weight:400;font-display:swap;src:url("../fonts/open-sauce-sans-latin-400-normal.woff2") format("woff2");}
@font-face{font-family:"Open Sauce Sans";font-style:italic;font-weight:400;font-display:swap;src:url("../fonts/open-sauce-sans-latin-400-italic.woff2") format("woff2");}
@font-face{font-family:"Open Sauce Sans";font-style:normal;font-weight:500;font-display:swap;src:url("../fonts/open-sauce-sans-latin-500-normal.woff2") format("woff2");}
@font-face{font-family:"Open Sauce Sans";font-style:italic;font-weight:500;font-display:swap;src:url("../fonts/open-sauce-sans-latin-500-italic.woff2") format("woff2");}
@font-face{font-family:"Open Sauce Sans";font-style:normal;font-weight:600;font-display:swap;src:url("../fonts/open-sauce-sans-latin-600-normal.woff2") format("woff2");}
@font-face{font-family:"Open Sauce Sans";font-style:italic;font-weight:600;font-display:swap;src:url("../fonts/open-sauce-sans-latin-600-italic.woff2") format("woff2");}
@font-face{font-family:"Open Sauce Sans";font-style:normal;font-weight:700;font-display:swap;src:url("../fonts/open-sauce-sans-latin-700-normal.woff2") format("woff2");}
@font-face{font-family:"Open Sauce Sans";font-style:italic;font-weight:700;font-display:swap;src:url("../fonts/open-sauce-sans-latin-700-italic.woff2") format("woff2");}
  :root{--font:"Open Sauce Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;}

  :root{
    color-scheme:light;
    --bg:#fbeef3; --card:#fff; --ink:#3a2c34; --ink-60:rgba(58,44,52,.62); --line:rgba(58,44,52,.14);
    --teal:#1f8f8a; --teal-deep:#17716d; --pink:#e75297; --lav:#efddfd;
    --serif:"Cormorant Garamond",Garamond,"Times New Roman",serif;
    --script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  }
  *,*::before,*::after{box-sizing:border-box;}
  [hidden]{display:none!important;}
  html,body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:18px; -webkit-font-smoothing:antialiased;}
  button,input{font:inherit; color:inherit;}
  button{cursor:pointer; border-radius:0;}
  .wrap{max-width:1280px; margin:0 auto; padding:16px;}
  header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:6px 0 14px;}
  h1{font-family:var(--font); font-weight:400; font-size:44px; margin:0; line-height:1;}
  .status{font-size:15px; color:var(--ink-60);}
  .status button{background:none; border:0; text-decoration:underline; padding:0 0 0 8px; color:var(--ink-60);}

  /* passcode */
  .lock{min-height:80vh; display:grid; place-items:center;}
  .lock form{background:var(--card); padding:28px 24px; width:100%; max-width:360px; display:flex; flex-direction:column; gap:12px; text-align:center;}
  .lock input{border:0; background:var(--lav); padding:12px 14px; font-size:18px; outline:none;}
  .lock input:focus-visible{box-shadow:inset 0 0 0 2px var(--teal);}
  .btn{border:0; background:var(--teal); color:#fff; padding:12px 16px; letter-spacing:.12em; text-transform:uppercase; font-size:15px; font-weight:600;}
  .btn:hover{background:var(--teal-deep);}
  .btn:disabled{opacity:.55; cursor:default;}
  .err{color:var(--pink); font-size:16px; min-height:1.2em; margin:0;}

  /* lists */
  .tabs{display:none; gap:0; margin-bottom:12px;}
  .tabs button{flex:1; border:1px solid var(--teal); background:transparent; color:var(--teal); padding:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; font-size:14px;}
  .tabs button[aria-selected="true"]{background:var(--teal); color:#fff;}
  .cols{display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start;}
  .col h2{margin:0 0 4px; font-size:22px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--teal);}
  .col .sub{margin:0 0 12px; font-size:15px; color:var(--ink-60);}
  .list{display:flex; flex-direction:column; gap:12px;}
  .empty{padding:24px 16px; background:var(--card); color:var(--ink-60); text-align:center; font-style:italic;}
  @media (max-width:819px){
    .tabs{display:flex;}
    .cols{grid-template-columns:1fr;}
    .col:not(.on){display:none;}
    .col h2{display:none;}
  }

  /* order card */
  .card{background:var(--card); display:grid; grid-template-columns:150px 1fr; gap:14px; padding:12px; border-left:4px solid var(--teal);}
  .card.unpaid{border-left-color:var(--pink);}
  .pic{width:150px; background:var(--lav); display:block; overflow:hidden; align-self:start;}
  .pic img{width:100%; aspect-ratio:3/4; height:auto; object-fit:contain; display:block; background:#fff;}
  .pic span{display:grid; place-items:center; aspect-ratio:3/4; font-size:14px; color:var(--ink-60); text-align:center; padding:8px;}
  .top{display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .num{font-size:26px; font-weight:700; letter-spacing:.02em;}
  .pos{font-size:14px; color:var(--ink-60); letter-spacing:.08em; text-transform:uppercase;}
  .who{font-size:21px; margin:2px 0 6px;}
  .when{display:inline-block; background:var(--teal); color:#fff; padding:3px 10px; font-weight:600; font-size:16px; margin-bottom:8px;}
  .badge{display:inline-block; border:1px solid var(--pink); color:var(--pink); padding:2px 8px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; margin:0 0 8px 6px; vertical-align:top;}
  dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:17px;}
  dt{color:var(--ink-60); text-transform:uppercase; font-size:13px; letter-spacing:.1em; padding-top:3px;}
  dd{margin:0;}
  ul{margin:0; padding-left:18px;}
  .actions{margin-top:10px; display:flex; gap:10px; align-items:center;}
  .actions .btn{padding:10px 18px; white-space:nowrap;}
  .note{font-size:14px; color:var(--ink-60);}
  @media (max-width:479px){
    .card{grid-template-columns:96px 1fr; gap:10px;}
    .pic{width:96px;}
    .num{font-size:22px;}
  }

  /* simple name-first cards + language switch */
  .langs{display:inline-flex; border:1.5px solid var(--teal); margin-left:12px; vertical-align:middle;}
  .langs button{border:0; background:transparent; color:var(--teal); padding:6px 12px; font-weight:600; font-size:15px;}
  .langs button[aria-pressed="true"]{background:var(--teal); color:#fff;}
  .name{font-size:30px; font-weight:700; line-height:1.1; margin:0;}
  .ord{font-size:15px; color:var(--ink-60); margin:2px 0 8px; letter-spacing:.04em;}
  .mode{display:inline-block; padding:6px 12px; font-weight:700; font-size:18px; margin:0 0 10px; color:#fff; background:var(--teal);}
  .mode.pickup{background:#7a3fb0;}
  .pieces{font-size:18px; margin:0 0 4px;}
  .pieces b{font-weight:600; color:var(--ink-60); font-size:14px; letter-spacing:.08em; text-transform:uppercase; margin-right:6px;}
  ol.adds{margin:4px 0 0; padding-left:22px; font-size:18px;}
  ol.adds li{margin-bottom:3px;}
  .bkh{font-weight:700; color:#4B2470; margin:10px 0 4px; font-size:16px;}
  .actions .btn.big{padding:14px 26px; font-size:17px;}
  .toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 16px; display:flex; gap:14px; align-items:center; font-size:16px; max-width:calc(100% - 32px);}
  .toast button{background:none; border:0; color:#fff; text-decoration:underline; padding:0; font-weight:600;}
  dt.bk{grid-column:1/-1; font-weight:700; color:#4B2470; margin-top:6px;} dd.bk{display:none;}
  .pic img.extra-pic{margin-top:8px;}

  /* ===== 4 × 6 in tags for the seamstress, English + Spanish ===== */
  .autoprint{display:inline-flex; align-items:center; gap:6px; margin-left:12px; font-size:15px; color:var(--ink);}
  .autoprint input{width:18px; height:18px; accent-color:var(--teal);}
  .btn.ghost{background:transparent; color:var(--teal); border:1.5px solid var(--teal);}
  .btn.ghost:hover{background:var(--lav);}
  .tip{font-size:13px; color:var(--ink-60); margin:-6px 0 12px;}
  #printArea{position:fixed; left:-10000px; top:0;}
  .tag{width:4in; height:6in; overflow:hidden; background:#fff; color:#2E2433; font-family:var(--font); padding:.16in .18in; display:flex; flex-direction:column; gap:.05in; font-size:var(--fs,10pt); line-height:1.22;}
  .tag *{margin:0;}
  .t-head{display:flex; align-items:center; justify-content:space-between; gap:8px; border-bottom:2px solid #2E2433; padding-bottom:.05in;}
  .t-logo{height:.42in; width:auto;}
  .t-num{text-align:right; font-size:2.1em; font-weight:700; line-height:1;}
  .t-num small,.t-who small,.t-sec h4{display:block; font-size:.5em; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:#6b5a66;}
  .t-sec h4{font-size:.78em; margin-bottom:.02in;}
  .t-who{font-size:1.45em; font-weight:600; line-height:1.1;}
  .t-meta{display:flex; justify-content:space-between; gap:6px; font-size:.82em; font-weight:600; background:#2E2433; color:#fff; padding:.03in .07in;}
  .t-pic{flex:0 1 auto; height:var(--pic,1.9in); min-height:.9in; width:100%; object-fit:contain; background:#faf6fe;}
  .t-sec .en{font-weight:600;}
  .t-sec .es{font-style:italic; color:#4B2470;}
  .t-sec ol{padding-left:1.2em;}
  .t-sec li{margin-bottom:.03in;}
  .t-sec li span{display:block;}
  @media print{
    @page{size:4in 6in; margin:0;}
    html,body{background:#fff !important;}
    body > *:not(#printArea){display:none !important;}
    #printArea{position:static; left:auto;}
    .tag{page-break-after:always; break-after:page;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-t="title">Orders</h1>
    <div class="status"><span id="statusIn" hidden><span id="updated"></span><button type="button" id="refresh" data-t="refresh">Refresh</button><button type="button" id="logout" data-t="lock">Lock</button>
      <label class="autoprint"><input type="checkbox" id="autoPrint" checked> <span data-t="auto">Auto-print new tags</span></label></span>
      <span class="langs" role="group" aria-label="Language · Idioma"><button type="button" data-lang="en" aria-pressed="true">English</button><button type="button" data-lang="es" aria-pressed="false">Español</button></span></div>
  </header>

  <section class="lock" id="lock">
    <form id="lockForm">
      <label for="pass" data-t="passLabel">Enter the seamstress passcode</label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit" data-t="open">Open</button>
      <p class="err" id="lockErr" role="alert"></p>
    </form>
  </section>

  <main id="queue" hidden>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="wait" aria-selected="true"><span data-t="waitH">Waiting here</span> (<span data-count="wait">0</span>)</button>
      <button type="button" role="tab" data-tab="pickup" aria-selected="false"><span data-t="pickH">Picking up later</span> (<span data-count="pickup">0</span>)</button>
    </div>
    <p class="err" id="loadErr" role="alert"></p>
    <div class="cols">
      <section class="col on" data-col="wait">
        <h2><span data-t="waitH">Waiting here</span> (<span data-count="wait">0</span>)</h2>
        <p class="sub" data-t="waitSub">The customer is here. Oldest first.</p>
        <div class="list" id="list-wait"></div>
      </section>
      <section class="col" data-col="pickup">
        <h2><span data-t="pickH">Picking up later</span> (<span data-count="pickup">0</span>)</h2>
        <p class="sub" data-t="pickSub">They come back later. Soonest pickup first.</p>
        <div class="list" id="list-pickup"></div>
      </section>
    </div>
  </main>
</div>
<div id="printArea" aria-hidden="true"></div>
<div class="toast" id="toast" hidden><span id="toastText"></span><button type="button" id="undo" data-t="undo">Undo</button></div>

<script>
(function(){
  var KEY = "peaces-seamstress-pass";
  var passcode = "";
  try { passcode = localStorage.getItem(KEY) || ""; } catch (e) {}
  var timer = null, loading = false, undoId = null, toastTimer = null;
  var $ = function(id){ return document.getElementById(id); };

  async function call(path, body){
    var r = await fetch("/api/seamstress/" + path, { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(Object.assign({ passcode: passcode }, body || {})) });
    var j = await r.json().catch(function(){ return {}; });
    if (!r.ok) { var e = new Error(j.error || "Something went wrong"); e.status = r.status; throw e; }
    return j;
  }

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function ago(iso){
    var m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (!isFinite(m)) return "";
    if (m < 1) return "just now";
    if (m < 60) return m + " min ago";
    return Math.floor(m / 60) + " h " + (m % 60) + " min ago";
  }
  function dayLabel(iso){
    var d = new Date(iso), t = new Date();
    if (d.toDateString() === t.toDateString()) return "";
    var tm = new Date(t); tm.setDate(t.getDate() + 1);
    return d.toDateString() === tm.toDateString() ? " tomorrow" : " " + d.toLocaleDateString(undefined, { weekday:"short" });
  }

  /* ---------- language ---------- */
  var LKEY = "peaces-seamstress-lang", lang = "en", lastQ = null;
  try { if (localStorage.getItem(LKEY) === "es") lang = "es"; } catch (e) {}
  var T = {
    title:["Orders","Pedidos"], refresh:["Refresh","Actualizar"], lock:["Lock","Bloquear"], auto:["Auto-print new tags","Imprimir etiquetas nuevas"],
    passLabel:["Enter the seamstress passcode","Escribe la contraseña"], open:["Open","Abrir"], undo:["Undo","Deshacer"],
    waitH:["Waiting here","Esperando aquí"], pickH:["Picking up later","Recogen después"],
    waitSub:["The customer is here. Oldest first.","La clienta está aquí. Primero la que lleva más tiempo."],
    pickSub:["They come back later. Soonest pickup first.","Regresan después. Primero la que recoge más pronto."],
    order:["Order","Pedido"], noName:["No name","Sin nombre"], top:["Top","Arriba"], bottom:["Bottom","Abajo"], adds:["Add-ons","Extras"], none:["None","Ninguno"],
    also:["Also in the bag","También en la bolsa"], done:["Done ✓","Listo ✓"], saving:["Saving…","Guardando…"], print:["Print tag","Imprimir etiqueta"],
    notPaid:["Not paid yet","Sin pagar"], noPic:["No picture","Sin foto"], told:["Customer was told ~{m} min","Se le dijo ~{m} min"],
    emptyWait:["No one waiting right now.","Nadie esperando ahorita."], emptyPick:["No pickups coming up.","No hay pedidos para recoger."],
    updated:["Updated","Actualizado"], cantRefresh:["Couldn't refresh: {e}. Retrying…","No se pudo actualizar: {e}. Reintentando…"],
    markedDone:["{n} done.","{n} listo."], cantDone:["Couldn't finish {n}: {e}","No se pudo terminar {n}: {e}"], cantUndo:["Couldn't undo: {e}","No se pudo deshacer: {e}"],
    bikini:["Bikini {i} of {n}","Bikini {i} de {n}"], one:["1 bikini","1 bikini"], name:["Name","Nombre"],
    customs:["Customizations","Personalizaciones"]
  };
  function t(k, v){ var s = (T[k] || [k, k])[lang === "es" ? 1 : 0]; if (v) Object.keys(v).forEach(function(x){ s = s.replace("{" + x + "}", v[x]); }); return s; }
  function L(en, es){ return lang === "es" ? (es || en) : en; }
  function clock(iso){ return new Date(iso).toLocaleTimeString(lang === "es" ? "es-MX" : "en-US", { hour:"numeric", minute:"2-digit" }); }
  function waited(iso){
    var m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (!isFinite(m) || m < 1) return lang === "es" ? "recién llegó" : "just now";
    return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + (m % 60) + " min";
  }
  function dayWord(iso){
    var d = new Date(iso), n = new Date();
    if (d.toDateString() === n.toDateString()) return "";
    var tm = new Date(n); tm.setDate(n.getDate() + 1);
    if (d.toDateString() === tm.toDateString()) return lang === "es" ? " mañana" : " tomorrow";
    return " " + d.toLocaleDateString(lang === "es" ? "es-MX" : "en-US", { weekday:"short" });
  }
  function modeText(o){
    if (o.mode === "pickup") return (lang === "es" ? "Recoge a las " : "Picks up at ") + o.pickupAt + (o.pickupDate ? dayWord(o.pickupDate) : "");
    return (lang === "es" ? "Esperando aquí · " : "Waiting here · ") + waited(o.chosenAt);
  }
  function applyLang(){
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(function(n){ n.textContent = t(n.dataset.t); });
    document.querySelectorAll(".langs button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });
    document.title = lang === "es" ? "Peaces · Pedidos" : "Peaces · Orders";
    if (lastQ) render(lastQ);
  }
  document.querySelectorAll(".langs button").forEach(function(b){
    b.addEventListener("click", function(){ lang = b.dataset.lang; try { localStorage.setItem(LKEY, lang); } catch (e) {} applyLang(); });
  });

  function card(o, i){
    var c = el("article", "card" + (o.paid ? "" : " unpaid"));
    var pic = el("div", "pic");
    if (o.image) { var img = el("img"); img.src = o.image; img.alt = ""; img.loading = "lazy"; pic.appendChild(img); }
    else pic.appendChild(el("span", null, t("noPic")));
    c.appendChild(pic);

    var body = el("div");
    body.appendChild(el("p", "name", o.customer || t("noName")));
    body.appendChild(el("p", "ord", t("order") + " " + o.number + "  ·  #" + (i + 1)));
    body.appendChild(el("span", "mode" + (o.mode === "pickup" ? " pickup" : ""), modeText(o)));
    if (!o.paid) body.appendChild(el("span", "badge", t("notPaid")));

    var bks = bikinisOfOrder(o);
    bks.forEach(function(b, bi){
      if (bks.length > 1) { body.appendChild(el("p", "bkh", t("bikini", { i: bi + 1, n: bks.length })));
        if (bi > 0 && b.image) { var im2 = el("img"); im2.src = b.image; im2.alt = ""; im2.className = "extra-pic"; im2.loading = "lazy"; pic.appendChild(im2); } }
      var p1 = el("p", "pieces"); p1.appendChild(el("b", null, t("top"))); p1.appendChild(document.createTextNode(L(b.top, b.topEs) || "—")); body.appendChild(p1);
      var p2 = el("p", "pieces"); p2.appendChild(el("b", null, t("bottom"))); p2.appendChild(document.createTextNode(L(b.bottom, b.bottomEs) || "—")); body.appendChild(p2);
      var ol = el("ol", "adds");
      if (!b.addons.length) ol.appendChild(el("li", null, t("none")));
      b.addons.forEach(function(a, k){ ol.appendChild(el("li", null, L(a, (b.addonsEs || [])[k]))); });
      body.appendChild(ol);
      if (b.extras && b.extras.length) { var p3 = el("p", "pieces"); p3.appendChild(el("b", null, t("also"))); p3.appendChild(document.createTextNode(b.extras.map(function(x){ return L(x.en, x.es); }).join(", "))); body.appendChild(p3); }
    });
    if (!(o.bikinis && o.bikinis.length) && o.extras && o.extras.length) { var p4 = el("p", "pieces"); p4.appendChild(el("b", null, t("also"))); p4.appendChild(document.createTextNode(o.extras.join(", "))); body.appendChild(p4); }

    var actions = el("div", "actions");
    var done = el("button", "btn big", t("done"));
    done.type = "button";
    done.addEventListener("click", function(){ markDone(o, done); });
    actions.appendChild(done);
    var pt = el("button", "btn ghost", t("print"));
    pt.type = "button";
    pt.addEventListener("click", function(){ var l = orderTags(o); if (printed) { l.forEach(function(x){ if (printed.indexOf(x.key) < 0) printed.push(x.key); }); savePrinted(); } printTags(l); });
    actions.appendChild(pt);
    if (o.minutes && o.mode === "wait") actions.appendChild(el("span", "note", t("told", { m: o.minutes })));
    body.appendChild(actions);
    c.appendChild(body);
    return c;
  }


  /* ---------- tags: one 4 × 6 card per bikini, English + Spanish ---------- */
  var PKEY = "peaces-printed-tags", AKEY = "peaces-autoprint";
  var printed = null;
  try { printed = JSON.parse(localStorage.getItem(PKEY) || "null"); } catch (e) {}
  try { if (localStorage.getItem(AKEY) === "0") $("autoPrint").checked = false; } catch (e) {}
  $("autoPrint").addEventListener("change", function(){ try { localStorage.setItem(AKEY, this.checked ? "1" : "0"); } catch (e) {} });
  function savePrinted(){ try { localStorage.setItem(PKEY, JSON.stringify(printed.slice(-600))); } catch (e) {} }
  function bikinisOfOrder(o){
    return (o.bikinis && o.bikinis.length) ? o.bikinis : [{ top:o.top, bottom:o.bottom, addons:o.addons || [], addonsEs:[], image:o.image, extras:[] }];
  }
  function tagFor(o, b, bi, n){
    var ES = lang === "es";
    function H(en, es){ return ES ? es : en + " · " + es; }
    var tg = el("section", "tag");
    var head = el("div", "t-head");
    var logo = el("img", "t-logo"); logo.src = "/art/logo-ps.png"; logo.alt = ""; head.appendChild(logo);
    var num = el("div", "t-num"); num.appendChild(el("small", null, H("Order", "Pedido"))); num.appendChild(document.createTextNode(o.number)); head.appendChild(num);
    tg.appendChild(head);
    var who = el("div", "t-who"); who.appendChild(el("small", null, H("Name", "Nombre"))); who.appendChild(document.createTextNode(o.customer || H("No name", "Sin nombre"))); tg.appendChild(who);
    var meta = el("div", "t-meta");
    meta.appendChild(el("span", null, n > 1 ? (ES ? "Bikini " + (bi + 1) + " de " + n : "Bikini " + (bi + 1) + " of " + n + " · " + (bi + 1) + " de " + n) : "1 bikini"));
    meta.appendChild(el("span", null, o.mode === "pickup" ? (ES ? "Recoge a las " + o.pickupAt : "Picks up " + o.pickupAt + " · Recoge " + o.pickupAt) : H("Waiting here", "Esperando aquí")));
    tg.appendChild(meta);
    if (b.image) { var im = el("img", "t-pic"); im.src = b.image; im.alt = ""; tg.appendChild(im); }
    function sec(h, en, es){ var d = el("div", "t-sec"); d.appendChild(el("h4", null, h));
      if (ES) d.appendChild(el("p", "en", es || en || ""));
      else { d.appendChild(el("p", "en", en || "")); if (es && es !== en) d.appendChild(el("p", "es", es)); }
      tg.appendChild(d); }
    sec(H("Top", "Parte de arriba"), b.top, b.topEs);
    sec(H("Bottom", "Parte de abajo"), b.bottom, b.bottomEs);
    var s = el("div", "t-sec"); s.appendChild(el("h4", null, H("Customizations", "Personalizaciones")));
    if (!b.addons.length) s.appendChild(el("p", "en", H("None", "Ninguna")));
    else { var ol = el("ol"); b.addons.forEach(function(a, k){ var li = el("li"), es = (b.addonsEs || [])[k];
      if (ES) li.appendChild(el("span", "en", es || a));
      else { li.appendChild(el("span", "en", a)); if (es) li.appendChild(el("span", "es", es)); }
      ol.appendChild(li); }); s.appendChild(ol); }
    tg.appendChild(s);
    if (b.extras && b.extras.length) sec(H("Also in the bag", "También en la bolsa"), b.extras.map(function(x){ return x.en; }).join(", "), b.extras.map(function(x){ return x.es || x.en; }).join(", "));
    return tg;
  }
  // shrink the text (then the picture) until everything fits on the 4 × 6 card
  function fit(t){
    var fs = 10.5, pic = 1.9;
    t.style.setProperty("--fs", fs + "pt"); t.style.setProperty("--pic", pic + "in");
    var guard = 0;
    while (t.scrollHeight > t.clientHeight + 1 && guard++ < 40) {
      if (pic > 1.1) pic -= 0.15; else if (fs > 6.5) fs -= 0.4; else break;
      t.style.setProperty("--fs", fs + "pt"); t.style.setProperty("--pic", pic + "in");
    }
  }
  function printTags(list){ // list: [{o, b, bi, n}]
    if (!list.length) return;
    var area = $("printArea"); area.textContent = "";
    list.forEach(function(x){ var t = tagFor(x.o, x.b, x.bi, x.n); area.appendChild(t); });
    var imgs = [].slice.call(area.querySelectorAll("img"));
    Promise.all(imgs.map(function(i){ return i.complete ? 0 : new Promise(function(r){ i.onload = i.onerror = r; setTimeout(r, 4000); }); })).then(function(){
      [].forEach.call(area.children, fit);
      setTimeout(function(){ window.print(); }, 60);
    });
  }
  function orderTags(o){ var bs = bikinisOfOrder(o); return bs.map(function(b, bi){ return { o:o, b:b, bi:bi, n:bs.length, key:o.id + "#" + bi }; }); }
  function chime(){
    try { var C = window.AudioContext || window.webkitAudioContext, ctx = new C();
      [880, 1175].forEach(function(f, i){ var g = ctx.createGain(), osc = ctx.createOscillator(); osc.frequency.value = f; osc.connect(g); g.connect(ctx.destination);
        var t0 = ctx.currentTime + i * 0.18; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35); osc.start(t0); osc.stop(t0 + 0.4); });
    } catch (e) {}
  }
  // after every refresh: print tags for paid bikinis we haven't printed on this device yet
  function autoTags(q){
    var all = q.wait.concat(q.pickup).filter(function(o){ return o.paid; }).reduce(function(acc, o){ return acc.concat(orderTags(o)); }, []);
    if (printed === null) { printed = all.map(function(x){ return x.key; }); savePrinted(); return; } // first time on this device: start fresh
    var fresh = all.filter(function(x){ return printed.indexOf(x.key) < 0; });
    if (!fresh.length) return;
    chime();
    if (!$("autoPrint").checked) return;
    fresh.forEach(function(x){ printed.push(x.key); }); savePrinted();
    printTags(fresh);
  }
  function render(q){
    lastQ = q;
    ["wait", "pickup"].forEach(function(k){
      var list = $("list-" + k);
      list.textContent = "";
      if (!q[k].length) list.appendChild(el("div", "empty", t(k === "wait" ? "emptyWait" : "emptyPick")));
      q[k].forEach(function(o, i){ list.appendChild(card(o, i)); });
      document.querySelectorAll('[data-count="' + k + '"]').forEach(function(n){ n.textContent = q[k].length; });
    });
    $("updated").textContent = t("updated") + " " + clock(new Date().toISOString());
  }

  async function load(){
    if (loading || !passcode) return;
    loading = true;
    try {
      var q = await call("queue", { tzOffset: new Date().getTimezoneOffset() });
      $("loadErr").textContent = "";
      show(true);
      render(q);
      autoTags(q);
    } catch (e) {
      if (e.status === 401 || e.status === 503) { lock(e.message); }
      else $("loadErr").textContent = t("cantRefresh", { e: e.message });
    } finally { loading = false; }
  }

  async function markDone(o, btn){
    btn.disabled = true; btn.textContent = t("saving");
    try {
      await call("done", { id: o.id, done: true });
      undoId = o.id;
      $("toastText").textContent = t("markedDone", { n: o.customer || o.number });
      $("toast").hidden = false;
      clearTimeout(toastTimer); toastTimer = setTimeout(function(){ $("toast").hidden = true; undoId = null; }, 8000);
      load();
    } catch (e) {
      btn.disabled = false; btn.textContent = t("done");
      $("loadErr").textContent = t("cantDone", { n: o.number, e: e.message });
    }
  }
  $("undo").addEventListener("click", async function(){
    if (!undoId) return;
    var id = undoId; undoId = null; $("toast").hidden = true;
    try { await call("done", { id: id, done: false }); } catch (e) { $("loadErr").textContent = t("cantUndo", { e: e.message }); }
    load();
  });

  function show(open){
    $("lock").hidden = open; $("queue").hidden = !open; $("statusIn").hidden = !open;
    clearInterval(timer);
    if (open) timer = setInterval(load, 20000);
  }
  function lock(msg){
    passcode = "";
    try { localStorage.removeItem(KEY); } catch (e) {}
    show(false);
    $("lockErr").textContent = msg || "";
  }

  $("lockForm").addEventListener("submit", function(e){
    e.preventDefault();
    passcode = $("pass").value;
    try { localStorage.setItem(KEY, passcode); } catch (err) {}
    $("lockErr").textContent = "";
    load();
  });
  $("refresh").addEventListener("click", load);
  $("logout").addEventListener("click", function(){ lock(""); $("pass").value = ""; });
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll(".tabs button").forEach(function(x){ x.setAttribute("aria-selected", String(x === b)); });
      document.querySelectorAll(".col").forEach(function(c){ c.classList.toggle("on", c.dataset.col === b.dataset.tab); });
    });
  });
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) load(); });

  applyLang();
  if (passcode) load();
})();
</script>
</body>
</html>
